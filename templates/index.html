<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Automation Panel</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; }
        section { border: 1px solid #ccc; padding: 1.5rem; margin-bottom: 2rem; border-radius: 8px; }
        label { display: block; margin-top: 0.5rem; }
        input, textarea, button { width: 100%; padding: 0.5rem; margin-top: 0.2rem; }
        button { background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .status { margin-top: 1rem; background: #f8f9fa; padding: 0.5rem; border-radius: 4px; }
        .task-id { font-family: monospace; background: #e9ecef; padding: 0.2rem 0.5rem; border-radius: 3px; }
        hr { margin: 2rem 0; }
    </style>
</head>
<body>
    <h1>⚡ TikTok Automation</h1>
    <div id="authStatus">Checking authentication...</div>

    <section>
        <h2>📨 Send Single DM</h2>
        <label>Username (without @)</label>
        <input type="text" id="dmUsername" placeholder="example_user">
        <label>Message</label>
        <textarea id="dmMessage" rows="3" placeholder="Your DM text..."></textarea>
        <button onclick="sendDM()">Send DM</button>
        <div id="dmResult" class="status"></div>
    </section>

    <section>
        <h2>➕ Follow a User</h2>
        <label>Username</label>
        <input type="text" id="followUsername" placeholder="example_user">
        <button onclick="followUser()">Follow</button>
        <div id="followResult" class="status"></div>
    </section>

    <section>
        <h2>🚀 Mass Follow Followers</h2>
        <label>Target Username</label>
        <input type="text" id="massTarget" placeholder="target_user">
        <label>Limit (max 200)</label>
        <input type="number" id="massLimit" value="50" min="1" max="200">
        <button onclick="startMassFollow()">Start Mass Follow</button>
        <div id="massFollowResult" class="status"></div>
    </section>

    <section>
        <h2>📨➕ Mass Follow + DM</h2>
        <label>Target Username</label>
        <input type="text" id="massDMTarget" placeholder="target_user">
        <label>DM Message</label>
        <textarea id="massDMMessage" rows="3" placeholder="Message to send after follow..."></textarea>
        <label>Limit (max 200)</label>
        <input type="number" id="massDMLimit" value="50" min="1" max="200">
        <button onclick="startMassFollowDM()">Start Follow+DM</button>
        <div id="massDMResult" class="status"></div>
    </section>

    <section>
        <h2>⏱️ Delays</h2>
        <label>Follow Delay (seconds, 1-30)</label>
        <input type="number" id="followDelay" value="4" min="1" max="30">
        <label>DM Delay (seconds, 2-60)</label>
        <input type="number" id="dmDelay" value="6" min="2" max="60">
        <button onclick="setDelays()">Update Delays</button>
        <div id="delayResult" class="status"></div>
    </section>

    <section>
        <h2>📋 Task Status</h2>
        <label>Task ID</label>
        <input type="text" id="taskIdInput" placeholder="e.g. abc-123">
        <button onclick="checkTask()">Check Status</button>
        <button onclick="cancelTask()" style="background:#dc3545;">Cancel Task</button>
        <div id="taskResult" class="status"></div>
    </section>

    <script>
        // Helper: fetch JSON and handle errors
        async function apiCall(url, method='GET', body=null) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            return res.json();
        }

        // Auth status
        fetch('/api/status')
            .then(r => r.json())
            .then(data => {
                document.getElementById('authStatus').innerHTML = data.authenticated
                    ? '✅ Session loaded (cookies found)'
                    : '❌ No session – set TIKTOK_COOKIES_JSON environment variable';
            });

        // Single DM
        async function sendDM() {
            const username = document.getElementById('dmUsername').value.trim();
            const message = document.getElementById('dmMessage').value.trim();
            if (!username || !message) return alert('Fill both fields');
            const res = await apiCall('/api/send', 'POST', { username, message });
            document.getElementById('dmResult').innerHTML = res.success ? `✅ ${res.message}` : `❌ ${res.error}`;
        }

        // Follow user
        async function followUser() {
            const username = document.getElementById('followUsername').value.trim();
            if (!username) return alert('Enter username');
            const res = await apiCall('/api/follow', 'POST', { username });
            document.getElementById('followResult').innerHTML = res.success ? `✅ ${res.message}` : `❌ ${res.error}`;
        }

        // Mass follow
        async function startMassFollow() {
            const target = document.getElementById('massTarget').value.trim();
            const limit = parseInt(document.getElementById('massLimit').value) || 50;
            if (!target) return alert('Enter target');
            const res = await apiCall('/api/mass_follow', 'POST', { target_username: target, limit });
            document.getElementById('massFollowResult').innerHTML = res.success ? `✅ ${res.message} (Task ID: <span class="task-id">${res.task_id}</span>)` : `❌ ${res.error}`;
        }

        // Mass follow + DM
        async function startMassFollowDM() {
            const target = document.getElementById('massDMTarget').value.trim();
            const message = document.getElementById('massDMMessage').value.trim();
            const limit = parseInt(document.getElementById('massDMLimit').value) || 50;
            if (!target || !message) return alert('Fill all fields');
            const res = await apiCall('/api/mass_follow_dm', 'POST', { target_username: target, dm_message: message, limit });
            document.getElementById('massDMResult').innerHTML = res.success ? `✅ ${res.message} (Task ID: <span class="task-id">${res.task_id}</span>)` : `❌ ${res.error}`;
        }

        // Set delays
        async function setDelays() {
            const fd = parseFloat(document.getElementById('followDelay').value);
            const dd = parseFloat(document.getElementById('dmDelay').value);
            if (isNaN(fd) || isNaN(dd)) return alert('Enter valid numbers');
            const res = await apiCall('/api/set_delays', 'POST', { follow_delay: fd, dm_delay: dd });
            document.getElementById('delayResult').innerHTML = res.success ? `✅ Updated: follow=${res.follow_delay}s, dm=${res.dm_delay}s` : `❌ ${res.error}`;
        }

        // Check task
        async function checkTask() {
            const id = document.getElementById('taskIdInput').value.trim();
            if (!id) return alert('Enter Task ID');
            const res = await apiCall(`/api/task_status/${id}`);
            if (res.completed) {
                document.getElementById('taskResult').innerHTML = res.success ? `✅ Completed: ${res.message}` : `❌ Failed: ${res.message}`;
            } else {
                document.getElementById('taskResult').innerHTML = `⏳ Still running... (${res.message})`;
            }
        }

        // Cancel task
        async function cancelTask() {
            const id = document.getElementById('taskIdInput').value.trim();
            if (!id) return alert('Enter Task ID');
            const res = await apiCall(`/api/cancel_task/${id}`, 'POST');
            document.getElementById('taskResult').innerHTML = res.success ? `✅ ${res.message}` : `❌ ${res.error}`;
        }
    </script>
</body>
</html>
