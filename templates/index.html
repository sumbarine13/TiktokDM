<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AXIOGRAM PRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #eaeaea; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
        .card { background: #1c1c1c; border: 1px solid #4caf50; border-radius: 16px; padding: 2rem 1.5rem; width: 100%; max-width: 520px; box-shadow: 0 0 24px rgba(76,175,80,0.2); }
        h1 { color: #4caf50; text-align: center; margin-bottom: 0.25rem; font-size: 2rem; letter-spacing: 2px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .status-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; background: #262626; padding: 0.75rem; border-radius: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #f44336; }
        .status-dot.connected { background: #4caf50; }
        .status-text { font-weight: 500; color: #ccc; }
        .section-title { color: #4caf50; margin: 1.5rem 0 0.8rem; border-top: 1px solid #333; padding-top: 1.5rem; }
        input, textarea { width: 100%; padding: 0.8rem; background: #262626; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 1rem; margin-bottom: 0.5rem; transition: border 0.2s; }
        input:focus, textarea:focus { outline: none; border-color: #4caf50; }
        textarea { resize: vertical; min-height: 70px; }
        .char-count { text-align: right; font-size: 0.8rem; color: #888; margin-top: -0.4rem; margin-bottom: 0.5rem; }
        .btn { background: #4caf50; color: #000; border: none; width: 100%; padding: 0.9rem; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .btn-blue { background: #2196F3; } .btn-purple { background: #9c27b0; } .btn-orange { background: #ff5722; } .btn-grey { background: #607d8b; }
        .response-msg { margin-top: 0.8rem; padding: 0.75rem; border-radius: 8px; display: none; font-weight: 500; }
        .response-msg.show { display: block; }
        .response-msg.success { background: #1b3b1b; border: 1px solid #4caf50; color: #a5d6a7; }
        .response-msg.error { background: #3b1b1b; border: 1px solid #f44336; color: #ef9a9a; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid transparent; border-top: 2px solid #000; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .delay-row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
        .delay-row label { color: #aaa; font-size: 0.9rem; }
        .delay-row input { width: 80px; padding: 0.4rem; text-align: center; }
        a { color: #4caf50; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>AXIOGRAM</h1>
        <p class="subtitle">TikTok DM & Follow Automation</p>

        <!-- Status -->
        <div class="status-row">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Checking connection…</span>
        </div>

        <!-- 1. Single DM -->
        <div class="section-title">📨 Send a DM</div>
        <input type="text" id="dmUsername" placeholder="@target_username" autocomplete="off">
        <textarea id="dmMessage" placeholder="Your message…" maxlength="500"></textarea>
        <div class="char-count" id="dmCharCount">0/500</div>
        <button class="btn" id="sendDmBtn" onclick="sendSingleDM()">
            <span id="sendDmText">Send DM</span>
            <span class="spinner" id="dmSpinner" style="display:none;"></span>
        </button>
        <div class="response-msg" id="dmResponse"></div>

        <!-- 2. Follow user -->
        <div class="section-title">👤 Follow a User</div>
        <input type="text" id="followUserInput" placeholder="@username to follow">
        <button class="btn btn-blue" onclick="followUser()">
            <span id="followBtnText">Follow</span>
        </button>
        <div class="response-msg" id="followResponse"></div>

        <!-- 3. Mass Follow -->
        <div class="section-title">👥 Mass Follow Followers</div>
        <input type="text" id="massTarget" placeholder="Target @username (whose followers to follow)">
        <input type="number" id="massLimit" placeholder="Max to follow (50)" min="1" max="200" value="50">
        <button class="btn btn-purple" onclick="startMassFollow()">
            <span id="massBtnText">Start Mass Follow</span>
        </button>
        <div id="massStatus" style="color:#aaa; font-size:0.85rem; margin-top:0.5rem;"></div>

        <!-- 4. Follow + DM Loop -->
        <div class="section-title">🔄 Follow & DM Loop</div>
        <input type="text" id="loopTarget" placeholder="Target @username (whose followers to scrape)">
        <textarea id="loopMessage" placeholder="DM message, e.g. 'Can you follow me back?'" maxlength="300"></textarea>
        <input type="number" id="loopLimit" placeholder="Max users (50)" min="1" max="200" value="50">
        <button class="btn btn-orange" onclick="startLoop()">
            <span id="loopBtnText">Start Follow &amp; DM</span>
        </button>
        <div id="loopStatus" style="color:#aaa; font-size:0.85rem; margin-top:0.5rem;"></div>

        <!-- 5. Delay Settings -->
        <div class="section-title">⏱️ Delay Settings</div>
        <div class="delay-row">
            <label>Follow delay (s):</label>
            <input type="number" id="followDelay" min="1" max="30" step="0.5" value="4.0">
            <label>DM delay (s):</label>
            <input type="number" id="dmDelay" min="2" max="60" step="0.5" value="6.0">
        </div>
        <button class="btn btn-grey" onclick="updateDelays()">Update Delays</button>
        <div id="delayStatus" style="color:#aaa; font-size:0.85rem; margin-top:0.3rem;"></div>
    </div>

    <script>
        // ======================== GLOBAL HELPERS ========================
        function showResponse(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `response-msg show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const dot = document.getElementById('statusDot');
                const txt = document.getElementById('statusText');
                if (data.authenticated) {
                    dot.classList.add('connected');
                    txt.textContent = 'TikTok session active';
                } else {
                    dot.classList.remove('connected');
                    txt.textContent = 'No session – add cookies';
                }
            } catch(e) {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Server unreachable';
            }
        }

        // ======================== 1. SINGLE DM ========================
        document.getElementById('dmMessage').addEventListener('input', function() {
            document.getElementById('dmCharCount').textContent = `${this.value.length}/500`;
        });

        async function sendSingleDM() {
            const username = document.getElementById('dmUsername').value.trim();
            const message = document.getElementById('dmMessage').value.trim();
            if (!username || !message) { showResponse('dmResponse', 'Fill both fields.', 'error'); return; }
            const btn = document.getElementById('sendDmBtn'), spin = document.getElementById('dmSpinner'), txt = document.getElementById('sendDmText');
            btn.disabled = true; spin.style.display = 'inline-block'; txt.textContent = 'Sending…';
            try {
                const res = await fetch('/api/send', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username, message}) });
                const data = await res.json();
                showResponse('dmResponse', data.message || data.error, data.success ? 'success' : 'error');
                if (data.success) { document.getElementById('dmMessage').value = ''; document.getElementById('dmCharCount').textContent = '0/500'; }
            } catch(e) { showResponse('dmResponse', 'Network error.', 'error'); }
            finally { btn.disabled = false; spin.style.display = 'none'; txt.textContent = 'Send DM'; }
        }

        // ======================== 2. FOLLOW USER ========================
        async function followUser() {
            const username = document.getElementById('followUserInput').value.trim();
            if (!username) return;
            const btn = document.getElementById('followBtnText');
            btn.textContent = 'Following…';
            try {
                const res = await fetch('/api/follow', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username}) });
                const data = await res.json();
                showResponse('followResponse', data.message, data.success ? 'success' : 'error');
                document.getElementById('followUserInput').value = '';
            } catch(e) { showResponse('followResponse', 'Network error.', 'error'); }
            finally { btn.textContent = 'Follow'; }
        }

        // ======================== 3. MASS FOLLOW ========================
        let massTaskId = null;
        async function startMassFollow() {
            const target = document.getElementById('massTarget').value.trim();
            const limit = parseInt(document.getElementById('massLimit').value) || 50;
            if (!target) return;
            const btn = document.getElementById('massBtnText');
            btn.textContent = 'Starting…';
            try {
                const res = await fetch('/api/mass_follow', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target_username:target, limit}) });
                const data = await res.json();
                if (data.success) {
                    massTaskId = data.task_id;
                    document.getElementById('massStatus').innerHTML = `Task running. <a href="#" onclick="checkMassStatus()">Check</a> | <a href="#" onclick="cancelMass()">Cancel</a>`;
                    setTimeout(checkMassStatus, 3000);
                } else { showResponse('massStatus', data.error || 'Start failed.', 'error'); }
            } catch(e) { showResponse('massStatus', 'Network error.', 'error'); }
            finally { btn.textContent = 'Start Mass Follow'; }
        }
        async function checkMassStatus() {
            if (!massTaskId) return;
            const res = await fetch(`/api/task_status/${massTaskId}`);
            const data = await res.json();
            if (data.completed) { document.getElementById('massStatus').textContent = data.message; massTaskId = null; }
            else { document.getElementById('massStatus').textContent = 'Still running…'; setTimeout(checkMassStatus, 5000); }
        }
        async function cancelMass() {
            if (!massTaskId) return;
            await fetch(`/api/cancel_task/${massTaskId}`, {method:'POST'});
            document.getElementById('massStatus').textContent = 'Cancelled.'; massTaskId = null;
        }

        // ======================== 4. FOLLOW + DM LOOP ========================
        let loopTaskId = null;
        async function startLoop() {
            const target = document.getElementById('loopTarget').value.trim();
            const message = document.getElementById('loopMessage').value.trim();
            const limit = parseInt(document.getElementById('loopLimit').value) || 50;
            if (!target || !message) { showResponse('loopStatus', 'Fill target and message.', 'error'); return; }
            const btn = document.getElementById('loopBtnText');
            btn.textContent = 'Starting…';
            try {
                const res = await fetch('/api/mass_follow_dm', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({target_username:target, dm_message:message, limit}) });
                const data = await res.json();
                if (data.success) {
                    loopTaskId = data.task_id;
                    document.getElementById('loopStatus').innerHTML = `Task running. <a href="#" onclick="checkLoopStatus()">Check</a> | <a href="#" onclick="cancelLoop()">Cancel</a>`;
                    setTimeout(checkLoopStatus, 4000);
                } else { showResponse('loopStatus', data.error || 'Start failed.', 'error'); }
            } catch(e) { showResponse('loopStatus', 'Network error.', 'error'); }
            finally { btn.textContent = 'Start Follow & DM'; }
        }
        async function checkLoopStatus() {
            if (!loopTaskId) return;
            const res = await fetch(`/api/task_status/${loopTaskId}`);
            const data = await res.json();
            if (data.completed) { document.getElementById('loopStatus').textContent = data.message; loopTaskId = null; }
            else { document.getElementById('loopStatus').textContent = 'Still running…'; setTimeout(checkLoopStatus, 6000); }
        }
        async function cancelLoop() {
            if (!loopTaskId) return;
            await fetch(`/api/cancel_task/${loopTaskId}`, {method:'POST'});
            document.getElementById('loopStatus').textContent = 'Cancelled.'; loopTaskId = null;
        }

        // ======================== 5. DELAY SETTINGS ========================
        async function updateDelays() {
            const followDelay = parseFloat(document.getElementById('followDelay').value);
            const dmDelay = parseFloat(document.getElementById('dmDelay').value);
            try {
                const res = await fetch('/api/set_delays', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({follow_delay:followDelay, dm_delay:dmDelay}) });
                const data = await res.json();
                document.getElementById('delayStatus').textContent = data.message || 'Updated.';
                document.getElementById('delayStatus').style.color = data.success ? '#4caf50' : '#f44336';
            } catch(e) { document.getElementById('delayStatus').textContent = 'Network error.'; }
        }
        async function loadDelays() {
            try {
                const res = await fetch('/api/get_delays');
                const data = await res.json();
                document.getElementById('followDelay').value = data.follow_delay;
                document.getElementById('dmDelay').value = data.dm_delay;
            } catch(e) {}
        }

        window.onload = function() { checkStatus(); loadDelays(); };
    </script>
</body>
</html>
